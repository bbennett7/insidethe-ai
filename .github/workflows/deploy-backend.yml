name: Deploy backend to Fly.io

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'

jobs:
  deploy-launchpad:
    name: Deploy to launchpad (staging)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: Preview - insidethe-ai-backend
      url: https://insidethe-ai-backend-launchpad.fly.dev
    permissions:
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to launchpad
        run: flyctl deploy --remote-only --config fly.launchpad.toml
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-prod:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: Production - insidethe-ai-backend
      url: https://insidethe-ai-backend.fly.dev
    permissions:
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to production
        run: flyctl deploy --remote-only
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
