<style>

/* ── DESIGN TOKENS ── */
:root {
  --bg:          #0a0a0a;
  --surface-1:   #111111;
  --surface-2:   #1a1a1a;
  --surface-3:   #222222;
  --ink:         #f5f5f0;
  --ink-muted:   #888888;
  --ink-quiet:   #555555;
  --ink-faint:   #2a2a2a;
  --acid:        #c4ff3d;
  --acid-dim:    #8aab2a;
  --acid-glow:   rgba(196,255,61,0.15);
  --warm:        #ff6b3d;
  --cool:        #3da9ff;
  --line:        rgba(255,255,255,0.08);
  --line-strong: rgba(255,255,255,0.16);
  --font-display: 'Fraunces', 'Times New Roman', serif;
  --font-body:    'Newsreader', 'Georgia', serif;
  --font-mono:    'JetBrains Mono', 'Menlo', monospace;
  --ease:    cubic-bezier(0.2, 0.8, 0.2, 1);
  --dur-mid: 240ms;
  --dur-slow: 480ms;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ── BACKGROUND CANVAS ── */
#bg-canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── NAV ── */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 32px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

/* Wordmark — matches style system size-sm exactly */
.tok-row {
  display: flex;
  align-items: center;
  gap: 3px;
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 400;
}
.tok {
  position: relative;
  padding: 6px 10px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.12);
  color: var(--ink);
  border-radius: 2px;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}
.tok::after {
  content: attr(data-id);
  position: absolute;
  top: -13px; left: 0;
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: 0.1em;
  color: var(--acid);
  font-weight: 400;
  white-space: nowrap;
}
.tok.tok-accent {
  background: var(--acid);
  color: #0a0a0a;
  border-color: var(--acid);
  font-weight: 700;
}

.nav-right {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-quiet);
}
.nav-right .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--acid);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.35; }
}

/* ── MAIN ── */
.main {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 68px 40px 16px;
  gap: 20px;
  overflow: hidden;
}

/* ── PAGE TITLE ── */
.page-title {
  font-family: var(--font-display);
  font-weight: 300;
  font-size: clamp(28px, 3.6vw, 48px);
  letter-spacing: -0.03em;
  line-height: 1;
  color: var(--ink);
  text-align: center;
}
.page-title em {
  font-style: italic;
  font-weight: 400;
  color: var(--acid);
}

/* ── PORTAL GRID ── */
.portal-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
  width: 100%;
  max-width: 580px;
}

/* ── PORTAL CARD ── */
.portal {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface-1);
  border: 1px solid var(--line);
  border-radius: 4px;
  overflow: hidden;
  cursor: not-allowed;
  transition: border-color var(--dur-mid) var(--ease),
              box-shadow var(--dur-mid) var(--ease),
              transform var(--dur-mid) var(--ease);
}

.portal--active {
  cursor: pointer;
  border-color: rgba(196,255,61,0.3);
}
.portal--active:hover {
  border-color: rgba(196,255,61,0.65);
  box-shadow: 0 0 0 1px rgba(196,255,61,0.15) inset,
              0 12px 48px rgba(196,255,61,0.12);
  transform: translateY(-3px);
}

/* Staggered float animation for all cards */
.portal { animation: float-card 5.5s ease-in-out infinite; }
.portal:nth-child(1) { animation-delay: 0s; }
.portal:nth-child(2) { animation-delay: 0.7s; }
.portal:nth-child(3) { animation-delay: 1.4s; }
.portal:nth-child(4) { animation-delay: 2.1s; }

@keyframes float-card {
  0%, 100% { transform: translateY(0px); }
  50%       { transform: translateY(-6px); }
}
.portal--active:hover { animation-play-state: paused; }

/* Canvas preview area */
.portal-preview {
  position: relative;
  aspect-ratio: 2;
  width: 100%;
  overflow: hidden;
}
.portal-preview canvas {
  width: 100%;
  height: 100%;
}

/* Disabled overlay */
.portal--disabled .portal-preview::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(10,10,10,0.55);
  backdrop-filter: grayscale(1);
}

/* Footer area below the preview */
.portal-footer {
  padding: 10px 14px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-top: 1px solid var(--line);
}

.portal-eyebrow {
  font-family: var(--font-body);
  font-style: italic;
  font-weight: 300;
  font-size: 12px;
  color: var(--ink);
  letter-spacing: 0.01em;
}
.portal--disabled .portal-eyebrow {
  color: var(--ink-muted);
}
.portal-name {
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--acid);
}
.portal--disabled .portal-name {
  color: var(--acid-dim);
  opacity: 0.5;
}

.portal-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
}

.portal-num {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--ink-faint);
}
.portal--active .portal-num {
  color: var(--acid-dim);
}

.portal-status-live {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--acid);
}
.portal-status-live .live-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--acid);
  animation: pulse-dot 1.6s ease-in-out infinite;
}

.portal-badge-soon {

  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-quiet);
  border: 1px solid var(--ink-faint);
  padding: 2px 6px;
  border-radius: 2px;
}

/* ── FOOTER ── */
.footer {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 580px;
  margin: 0 auto;
  padding: 10px 0 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid var(--line);
}
.footer span {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-quiet);
}
.footer .acid { color: var(--acid-dim); }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .portal-grid { grid-template-columns: 1fr; max-width: 400px; }
  .nav { padding: 16px 20px; }
  .main { padding: 80px 20px 40px; gap: 36px; }

/* ── LIGHT MODE ── */
.light {
  --bg:          #f5f5f0;
  --surface-1:   #ebebea;
  --surface-2:   #e0e0de;
  --surface-3:   #d6d6d4;
  --ink:         #0a0a0a;
  --ink-muted:   #555555;
  --ink-quiet:   #888888;
  --ink-faint:   #ccccca;
  --acid:        #8fdc00;
  --acid-dim:    #6aaa00;
  --acid-glow:   rgba(143,220,0,0.14);
  --line:        rgba(0,0,0,0.08);
  --line-strong: rgba(0,0,0,0.14);
}
.light .tok {

}
.light .tok.tok-accent {

.light .portal--active {

}
.light .portal--active:hover {
  border-color: rgba(143,220,0,0.65);
  box-shadow: 0 0 0 1px rgba(143,220,0,0.14) inset, 0 12px 48px rgba(143,220,0,0.1);
}
.light .portal-preview {

}
.light .portal--disabled {
  opacity: 0.72;
}
.light .portal--disabled .portal-preview::after {
  background: rgba(15,15,15,0.6);
}

/* ── THEME TOGGLE ── */
.theme-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 50;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 7px 13px;

  border: 1px solid var(--line-strong);
  color: var(--ink-muted);
  cursor: pointer;
  border-radius: 3px;
  transition: color 120ms;
}
.theme-toggle:hover { color: var(--ink); }

</style>

<script>
/* ── Theme helpers ── */
let _dark = true;
function pal(d, l) { return _dark ? d : l; }
function _toggleTheme() {
  _dark = !_dark;
  document.body.classList.toggle('light', !_dark);
  document.querySelector('.theme-toggle').textContent = _dark ? 'light mode' : 'dark mode';

/* ══════════════════════════════════════════════
   BACKGROUND — black hole wavy polar grid
══════════════════════════════════════════════ */
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx = bgCanvas.getContext('2d');

function resizeBg() {
  bgCanvas.width = window.innerWidth * devicePixelRatio;
  bgCanvas.height = window.innerHeight * devicePixelRatio;
  bgCanvas.style.width = `${window.innerWidth}px`;
  bgCanvas.style.height = `${window.innerHeight}px`;
}

function drawBg(t) {
  const W = bgCanvas.width, H = bgCanvas.height;
  const dpr = devicePixelRatio;
  const cx = W * 0.5, cy = H * 0.5;

  bgCtx.clearRect(0, 0, W, H);
  bgCtx.fillStyle = pal('#0a0a0a', '#f5f5f0');
  bgCtx.fillRect(0, 0, W, H);

  // Gravitational lensing: straight grid lines bent toward a central mass
  const spacing = 46 * dpr;
  const lensR = Math.min(W, H) * 0.22;
  const lensStrength = lensR * lensR * 1.1;

  function lensPoint(x, y) {
    const dx = x - cx, dy = y - cy;
    const dist2 = dx * dx + dy * dy;
    if (dist2 < 4) return [cx, cy];
    // Slow breathing warp on top of the static lens
    const dist = Math.sqrt(dist2);
    const wave = 0.04 * Math.sin(dist * 0.009 - t * 0.0005);
    const pull = (lensStrength / (dist2 + lensR * lensR * 0.12)) * (1 + wave);
    return [x - dx * pull, y - dy * pull];
  }

  bgCtx.lineWidth = 0.9 * dpr;
  const lineAlpha = 0.1;

  // Vertical grid lines
  for (let gx = (cx % spacing); gx <= W + spacing; gx += spacing) {
    bgCtx.beginPath();
    let first = true;
    for (let gy = -spacing; gy <= H + spacing; gy += 4) {
      const [px, py] = lensPoint(gx, gy);
      first ? bgCtx.moveTo(px, py) : bgCtx.lineTo(px, py);
      first = false;
    }
    bgCtx.strokeStyle = pal(`rgba(255,255,255,${lineAlpha})`, `rgba(0,0,0,${lineAlpha})`);
    bgCtx.stroke();
  }

  // Horizontal grid lines
  for (let gy = (cy % spacing); gy <= H + spacing; gy += spacing) {
    bgCtx.beginPath();
    let first = true;
    for (let gx = -spacing; gx <= W + spacing; gx += 4) {
      const [px, py] = lensPoint(gx, gy);
      first ? bgCtx.moveTo(px, py) : bgCtx.lineTo(px, py);
      first = false;
    }
    bgCtx.strokeStyle = pal(`rgba(255,255,255,${lineAlpha})`, `rgba(0,0,0,${lineAlpha})`);
    bgCtx.stroke();
  }

  // Dark void swallowing the grid at center (event horizon)
  const voidR = lensR * 0.55;
  const voidGrd = bgCtx.createRadialGradient(cx, cy, 0, cx, cy, voidR * 2.2);
  const _vFull = pal('rgba(10,10,10,1)',    'rgba(245,245,240,1)');
  const _vMid  = pal('rgba(10,10,10,0.55)', 'rgba(245,245,240,0.55)');
  const _vNone = pal('rgba(10,10,10,0)',    'rgba(245,245,240,0)');
  voidGrd.addColorStop(0,    _vFull);
  voidGrd.addColorStop(0.45, _vFull);
  voidGrd.addColorStop(0.75, _vMid);
  voidGrd.addColorStop(1,    _vNone);
  bgCtx.fillStyle = voidGrd;
  bgCtx.fillRect(0, 0, W, H);

  // Accretion ring — faint acid glow around the horizon
  const ringR = voidR * 1.15;
  const ringGrd = bgCtx.createRadialGradient(cx, cy, ringR * 0.8, cx, cy, ringR * 1.6);
  ringGrd.addColorStop(0,    'rgba(0,0,0,0)');
  ringGrd.addColorStop(0.35, pal('rgba(196,255,61,0.055)', 'rgba(143,220,0,0.1)'));
  ringGrd.addColorStop(0.65, pal('rgba(196,255,61,0.025)', 'rgba(143,220,0,0.05)'));
  ringGrd.addColorStop(1,    'rgba(0,0,0,0)');
  bgCtx.fillStyle = ringGrd;
  bgCtx.fillRect(0, 0, W, H);
}

window.addEventListener('resize', () => { resizeBg(); });
resizeBg();

let _bgRaf;
function bgLoop(ts) {
  drawBg(ts);
  _bgRaf = requestAnimationFrame(bgLoop);
}
requestAnimationFrame(bgLoop);


/* ══════════════════════════════════════════════
   PORTAL 01 — Inside the Processing
   Live attention weight matrix (8×8, causal)
══════════════════════════════════════════════ */
const procCanvas = document.getElementById('canvas-process');
const procCtx = procCanvas.getContext('2d');

const N = 8;
const TOKENS = ['in', 'side', 'the', '.ai', 'maps', 'to', 'new', '▸'];

function makeWeights() {
  return Array.from({length: N}, (_, i) =>
    Array.from({length: N}, (_, j) => {
      if (j > i) return 0;
      if (j === i) return 0.1 + Math.random() * 0.25;
      if (j === i - 1) return 0.3 + Math.random() * 0.45;
      if (j === 2 && i > 3) return 0.25 + Math.random() * 0.5;
      if (j === 0) return 0.04 + Math.random() * 0.1;
      return Math.max(0, Math.random() * 0.28 - 0.05);
    })
  );
}

let procWeights = makeWeights();
let procTarget = makeWeights();
let procLastSwap = 0;

function lerp(a, b, t) { return a + (b - a) * t; }

function lerpWeights(cur, tgt, alpha) {
  return cur.map((row, i) => row.map((v, j) => lerp(v, tgt[i][j], alpha)));
}

function sizeProc() {
  const rect = procCanvas.parentElement.getBoundingClientRect();
  const dpr = devicePixelRatio;
  procCanvas.width = rect.width * dpr;
  procCanvas.height = rect.height * dpr;
  procCanvas.style.width = `${rect.width}px`;
  procCanvas.style.height = `${rect.height}px`;
}

function drawProc(_t) {
  const W = procCanvas.width, H = procCanvas.height;
  const dpr = devicePixelRatio;
  procCtx.clearRect(0, 0, W, H);
  procCtx.fillStyle = pal('#0e0e0e', '#2a2a2a');
  procCtx.fillRect(0, 0, W, H);

  const pad = 28 * dpr;
  const labelW = 32 * dpr;
  const labelH = 22 * dpr;
  const gridW = W - pad * 2 - labelW;
  const gridH = H - pad * 2 - labelH;
  const cw = gridW / N;
  const ch = gridH / N;
  const fontSize = Math.floor(Math.min(cw, ch) * 0.28);

  // Grid cells
  procWeights.forEach((row, i) => {
    row.forEach((v, j) => {
      if (j > i) return;
      const x = pad + labelW + j * cw;
      const y = pad + labelH + i * ch;
      const alpha = 0.03 + v * 0.88;
      procCtx.fillStyle = pal(`rgba(196,255,61,${alpha})`, `rgba(143,220,0,${alpha})`);
      procCtx.fillRect(x + 1, y + 1, cw - 2, ch - 2);

      if (v > 0.38) {
        procCtx.fillStyle = `rgba(10,10,10,${0.6 + v * 0.35})`;
        procCtx.font = `${fontSize}px "JetBrains Mono", monospace`;
        procCtx.textAlign = 'center';
        procCtx.textBaseline = 'middle';
        procCtx.fillText(v.toFixed(2), x + cw / 2, y + ch / 2);
      }
    });
  });

  // Axis tick lines
  procCtx.strokeStyle = pal('rgba(255,255,255,0.04)', 'rgba(255,255,255,0.05)');
  procCtx.lineWidth = 0.5 * dpr;
  for (let i = 0; i <= N; i++) {
    const x = pad + labelW + i * cw;
    const y = pad + labelH + i * ch;
    procCtx.beginPath();
    procCtx.moveTo(x, pad + labelH);
    procCtx.lineTo(x, pad + labelH + gridH);
    procCtx.stroke();
    procCtx.beginPath();
    procCtx.moveTo(pad + labelW, y);
    procCtx.lineTo(pad + labelW + gridW, y);
    procCtx.stroke();
  }

  // Token labels — row (left)
  procCtx.fillStyle = pal('rgba(136,136,136,0.7)', 'rgba(130,130,130,0.8)');
  procCtx.font = `${Math.floor(fontSize * 0.9)}px "JetBrains Mono", monospace`;
  procCtx.textAlign = 'right';
  procCtx.textBaseline = 'middle';
  TOKENS.forEach((tok, i) => {
    procCtx.fillText(tok, pad + labelW - 6 * dpr, pad + labelH + i * ch + ch / 2);
  });

  // Token labels — column (top)
  procCtx.textAlign = 'center';
  procCtx.textBaseline = 'bottom';
  TOKENS.forEach((tok, j) => {
    procCtx.fillText(tok, pad + labelW + j * cw + cw / 2, pad + labelH - 5 * dpr);
  });

  // Header label
  procCtx.fillStyle = pal('rgba(196,255,61,0.45)', 'rgba(143,220,0,0.85)');
  procCtx.font = `${Math.floor(9 * dpr)}px "JetBrains Mono", monospace`;
  procCtx.textAlign = 'left';
  procCtx.textBaseline = 'top';
  procCtx.fillText('ATTN · LAYER 06 · HEAD 03', pad, 10 * dpr);
}

let _procRaf;
function procLoop(ts) {
  if (ts - procLastSwap > 2200) {
    procTarget = makeWeights();
    procLastSwap = ts;
  }
  procWeights = lerpWeights(procWeights, procTarget, 0.03);
  drawProc(ts);
  _procRaf = requestAnimationFrame(procLoop);
}

sizeProc();
requestAnimationFrame(procLoop);


/* ══════════════════════════════════════════════
   PORTAL 02 — Inside the Chip (static)
   Circuit board trace pattern
══════════════════════════════════════════════ */
function drawChip() {
  const el = document.getElementById('canvas-chip');
  const rect = el.parentElement.getBoundingClientRect();
  const dpr = devicePixelRatio;
  el.width = rect.width * dpr;
  el.height = rect.height * dpr;
  el.style.width = `${rect.width}px`;
  el.style.height = `${rect.height}px`;

  const ctx = el.getContext('2d');
  const W = el.width, H = el.height;
  ctx.fillStyle = pal('#0c0c0c', '#2a2a2a');
  ctx.fillRect(0, 0, W, H);

  const grid = 22 * dpr;
  const cols = Math.ceil(W / grid);
  const rows = Math.ceil(H / grid);

  // Dots at grid intersections
  ctx.fillStyle = pal('rgba(255,255,255,0.07)', 'rgba(255,255,255,0.08)');
  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c <= cols; c++) {
      ctx.beginPath();
      ctx.arc(c * grid, r * grid, 1.2 * dpr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Horizontal + vertical trace segments (random subset)
  const rng = seededRng(42);
  ctx.strokeStyle = pal('rgba(255,255,255,0.09)', 'rgba(255,255,255,0.1)');
  ctx.lineWidth = 1.2 * dpr;
  ctx.lineCap = 'round';

  for (let r = 0; r <= rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (rng() > 0.38) {
        ctx.beginPath();
        ctx.moveTo(c * grid, r * grid);
        ctx.lineTo((c + 1) * grid, r * grid);
        ctx.stroke();
      }
    }
  }
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c <= cols; c++) {
      if (rng() > 0.38) {
        ctx.beginPath();
        ctx.moveTo(c * grid, r * grid);
        ctx.lineTo(c * grid, (r + 1) * grid);
        ctx.stroke();
      }
    }
  }

  // Larger component squares
  ctx.strokeStyle = pal('rgba(255,255,255,0.12)', 'rgba(255,255,255,0.13)');
  ctx.lineWidth = 1.5 * dpr;
  [[3,2],[6,5],[2,7],[7,3],[4,8],[9,6]].forEach(([c, r]) => {
    if (c * grid < W && r * grid < H) {
      ctx.strokeRect(c * grid - 8 * dpr, r * grid - 8 * dpr, 16 * dpr, 16 * dpr);
    }
  });

  // Label
  ctx.fillStyle = pal('rgba(85,85,85,0.7)', 'rgba(130,130,130,0.8)');
  ctx.font = `${9 * dpr}px "JetBrains Mono", monospace`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('SILICON · LOCKED', 10 * dpr, 10 * dpr);
}


/* ══════════════════════════════════════════════
   PORTAL 03 — Inside the Algorithms (static)
   Loss landscape contours
══════════════════════════════════════════════ */
function drawAlgo() {
  const el = document.getElementById('canvas-algo');
  const rect = el.parentElement.getBoundingClientRect();
  const dpr = devicePixelRatio;
  el.width = rect.width * dpr;
  el.height = rect.height * dpr;
  el.style.width = `${rect.width}px`;
  el.style.height = `${rect.height}px`;

  const ctx = el.getContext('2d');
  const W = el.width, H = el.height;
  ctx.fillStyle = pal('#0c0c0c', '#2a2a2a');
  ctx.fillRect(0, 0, W, H);

  // Draw contour lines of a 2D loss surface
  // Simulated with concentric warped ellipses at different offsets
  const centers = [
    { x: W * 0.38, y: H * 0.45, rx: W * 0.28, ry: H * 0.22 },
    { x: W * 0.62, y: H * 0.55, rx: W * 0.18, ry: H * 0.15 },
  ];

  centers.forEach(({ x, y, rx, ry }) => {
    for (let k = 1; k <= 8; k++) {
      const scale = k / 8;
      ctx.beginPath();
      for (let a = 0; a <= Math.PI * 2; a += 0.04) {
        const w = 1 + 0.08 * Math.sin(3 * a + k * 0.4);
        const px = x + rx * scale * w * Math.cos(a);
        const py = y + ry * scale * w * Math.sin(a);
        a < 0.05 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.strokeStyle = pal(`rgba(255,255,255,${0.06 * (1 - scale * 0.5)})`, `rgba(255,255,255,${0.07 * (1 - scale * 0.5)})`);
      ctx.lineWidth = 0.8 * dpr;
      ctx.stroke();
    }
    // Minimum marker
    ctx.beginPath();
    ctx.arc(x, y, 3 * dpr, 0, Math.PI * 2);
    ctx.fillStyle = pal('rgba(255,255,255,0.18)', 'rgba(255,255,255,0.2)');
    ctx.fill();
  });

  // Gradient descent path
  ctx.beginPath();
  ctx.setLineDash([3 * dpr, 4 * dpr]);
  ctx.moveTo(W * 0.15, H * 0.12);
  ctx.bezierCurveTo(W * 0.3, H * 0.28, W * 0.36, H * 0.38, W * 0.38, H * 0.45);
  ctx.strokeStyle = pal('rgba(255,255,255,0.14)', 'rgba(255,255,255,0.15)');
  ctx.lineWidth = 1 * dpr;
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = pal('rgba(85,85,85,0.7)', 'rgba(130,130,130,0.8)');
  ctx.font = `${9 * dpr}px "JetBrains Mono", monospace`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('OPTIM · LOCKED', 10 * dpr, 10 * dpr);
}


/* ══════════════════════════════════════════════
   PORTAL 04 — Inside the Agent (static)
   Decision tree / tool call chain
══════════════════════════════════════════════ */
function drawAgent() {
  const el = document.getElementById('canvas-agent');
  const rect = el.parentElement.getBoundingClientRect();
  const dpr = devicePixelRatio;
  el.width = rect.width * dpr;
  el.height = rect.height * dpr;
  el.style.width = `${rect.width}px`;
  el.style.height = `${rect.height}px`;

  const ctx = el.getContext('2d');
  const W = el.width, H = el.height;
  ctx.fillStyle = pal('#0c0c0c', '#2a2a2a');
  ctx.fillRect(0, 0, W, H);

  const nodes = [
    { x: 0.5, y: 0.12, label: 'PERCEIVE' },
    { x: 0.5, y: 0.35, label: 'REASON' },
    { x: 0.25, y: 0.6,  label: 'PLAN' },
    { x: 0.75, y: 0.6,  label: 'TOOL' },
    { x: 0.25, y: 0.85, label: 'ACT' },
    { x: 0.75, y: 0.85, label: 'OBSERVE' },
  ];

  const edges = [[0,1],[1,2],[1,3],[2,4],[3,5]];

  // Edges
  ctx.strokeStyle = pal('rgba(255,255,255,0.09)', 'rgba(255,255,255,0.1)');
  ctx.lineWidth = 1 * dpr;
  ctx.setLineDash([4 * dpr, 4 * dpr]);
  edges.forEach(([a, b]) => {
    const na = nodes[a], nb = nodes[b];
    ctx.beginPath();
    ctx.moveTo(na.x * W, na.y * H);
    ctx.lineTo(nb.x * W, nb.y * H);
    ctx.stroke();
  });
  ctx.setLineDash([]);

  // Nodes
  nodes.forEach(({ x, y, label }) => {
    const nr = 16 * dpr;
    ctx.beginPath();
    ctx.arc(x * W, y * H, nr, 0, Math.PI * 2);
    ctx.strokeStyle = pal('rgba(255,255,255,0.11)', 'rgba(255,255,255,0.12)');
    ctx.lineWidth = 1 * dpr;
    ctx.stroke();

    ctx.fillStyle = pal('rgba(85,85,85,0.65)', 'rgba(130,130,130,0.8)');
    ctx.font = `${8 * dpr}px "JetBrains Mono", monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x * W, y * H);
  });

  ctx.fillStyle = pal('rgba(85,85,85,0.7)', 'rgba(130,130,130,0.8)');
  ctx.font = `${9 * dpr}px "JetBrains Mono", monospace`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('AGENT · LOCKED', 10 * dpr, 10 * dpr);
}


/* ── Seeded RNG for reproducible chip pattern ── */
function seededRng(seed) {
  let s = seed;
  return () => {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}


/* ── Init disabled canvases on load ── */
window.addEventListener('load', () => {
  drawChip();
  drawAlgo();
  drawAgent();
});

window.addEventListener('resize', () => {
  resizeBg();
  sizeProc();
  drawChip();
  drawAlgo();
  drawAgent();
});

</script>
